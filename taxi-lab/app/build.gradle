plugins { id 'com.android.application' }
android {
    namespace 'pl.taxilab.test'
    compileSdk 35
    defaultConfig {
        // Separate app ID avoids Android INSTALL_FAILED_UPDATE_INCOMPATIBLE.
        // Earlier CI debug APKs used a newly generated signing certificate each run.
        applicationId 'pl.taxilab.diagnostics'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '0.4.2-diagnostics'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}