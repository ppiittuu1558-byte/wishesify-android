name: Taxi Lab - APK instalacyjny
on:
  push:
    branches: [taxi-lab-android-prototype]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android API
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon -p taxi-lab :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TaxiLab-APK-test
          path: taxi-lab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
